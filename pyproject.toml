[project]
name = "coremem"
version = "0.1.0"
description = "Zero-LLM memory retrieval for AI agents — semantic search and deterministic heuristics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Eddy Vinck" }
]
keywords = ["memory", "ai-agents", "retrieval", "semantic-search", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hybrid = ["hybriddb>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coremem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
