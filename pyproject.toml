[project]
name = "coremem"
version = "0.6.2"
description = "Zero-LLM memory for AI agents — semantic search, cross-encoder reranking, and deterministic heuristics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Eddy Vinck" }
]
keywords = ["memory", "ai-agents", "retrieval", "semantic-search", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "chromadb>=0.5.0,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "sentence-transformers>=2.0.0,<6.0.0",
    "hybriddb>=0.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
observer = ["httpx>=0.25.0"]
all = ["coremem[observer]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coremem"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
